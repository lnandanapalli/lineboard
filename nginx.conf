# Abuse protection: each client gets a fair request rate. Behind Azure App Service (or another
# proxy) the client address arrives in X-Forwarded-For; the first entry is the client (a port, if
# present, is dropped so it stays one key per client). A spoofed header only changes the caller's
# own bucket: it cannot exhaust anyone else's.
map $http_x_forwarded_for $lb_client {
  ""                                    $binary_remote_addr;
  "~^\s*(?<ip4>\d+\.\d+\.\d+\.\d+)(:\d+)?\s*(,|$)" $ip4;
  "~^\s*(?<first>[^,\s]+)"               $first;
}
# A page load fetches a few dozen files; 20 per second with bursts of 100 is far above that.
limit_req_zone $lb_client zone=lb_req:10m rate=20r/s;
limit_req_status 429;
limit_conn_zone $lb_client zone=lb_conn:10m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  limit_req zone=lb_req burst=100 nodelay;
  limit_conn lb_conn 50;
  # A static site: nothing to upload, and only GET / HEAD make sense.
  client_max_body_size 1k;
  if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
  }

  # www <-> bare-domain redirect, written at start-up from CANONICAL_HOST (empty when unset).
  include /etc/nginx/snippets/canonical-host.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Hashed build output never changes.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Written at container start from environment variables.
  location = /config.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store";
  }

  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Health probe for Azure App Service / load balancers.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
