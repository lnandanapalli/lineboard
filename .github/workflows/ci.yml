name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: lineboard:ci
      - name: Smoke test the container
        run: |
          docker run -d --name lb -p 8080:80 -e SUPABASE_URL=https://example.supabase.co -e SUPABASE_ANON_KEY=test lineboard:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q '<title>Lineboard</title>'
          curl -fsS http://localhost:8080/config.js | grep -q 'https://example.supabase.co'
          curl -fsSI http://localhost:8080/ | grep -qi 'content-security-policy'
          docker rm -f lb
