name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks on the exact commit it is about to publish.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: lineboard:ci
      - name: Smoke test the container
        run: |
          docker run -d --name lb -p 8080:80 -e SUPABASE_URL=https://example.supabase.co -e SUPABASE_ANON_KEY=test lineboard:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q '<title>Lineboard</title>'
          curl -fsS http://localhost:8080/config.js | grep -q 'https://example.supabase.co'
          curl -fsSI http://localhost:8080/ | grep -qi 'content-security-policy'
          curl -fsSI http://localhost:8080/ | grep -qi 'strict-transport-security'
          # Only GET / HEAD, and a request flood from one client is slowed down.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d x=1 http://localhost:8080/app)" = 405
          limited=$(for i in $(seq 1 250); do curl -s -o /dev/null -w '%{http_code}\n' http://localhost:8080/app; done | grep -c 429 || true)
          echo "429s in a burst of 250: $limited"; test "$limited" -gt 0
          sleep 6
          # Spoofed X-Forwarded-For entries do not dodge the limit: only the last one, added by the
          # trusted proxy in front (here the Docker gateway), names the client.
          spoofed=$(for i in $(seq 1 250); do curl -s -o /dev/null -w '%{http_code}\n' -H "X-Forwarded-For: 10.$i.0.1, 198.51.100.7" http://localhost:8080/app; done | grep -c 429 || true)
          echo "429s with a rotating spoofed prefix: $spoofed"; test "$spoofed" -gt 0
          sleep 6
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/app)" = 200
          # No CANONICAL_HOST: www is served, not redirected.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: www.example.com' http://localhost:8080/app)" = 200
          docker rm -f lb
      - name: Smoke test rate limiting without a trusted proxy
        run: |
          docker run -d --name lbn -p 8082:80 -e TRUSTED_PROXIES=none lineboard:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8082/healthz && break; sleep 1; done
          # A client talking to nginx directly cannot change its bucket with the header at all.
          limited=$(for i in $(seq 1 250); do curl -s -o /dev/null -w '%{http_code}\n' -H "X-Forwarded-For: 198.51.100.$i" http://localhost:8082/app; done | grep -c 429 || true)
          echo "429s with a rotating header and no trusted proxy: $limited"; test "$limited" -gt 0
          docker rm -f lbn
      - name: Smoke test the www redirect
        run: |
          docker run -d --name lbc -p 8081:80 -e CANONICAL_HOST=example.com lineboard:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8081/healthz && break; sleep 1; done
          out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -H 'Host: www.example.com' 'http://localhost:8081/app?x=1')
          echo "$out"; test "$out" = "301 https://example.com/app?x=1"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: example.com' http://localhost:8081/app)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: myapp.azurewebsites.net' http://localhost:8081/healthz)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: www.example.com' http://localhost:8081/healthz)" = 200
          docker rm -f lbc

  # The database rules in supabase/schema.sql, on real PostgreSQL (supabase-stub.sql stands in for
  # Supabase's own schemas). Applied twice, as operators re-run it to upgrade.
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - name: Apply the schema and check its rules
        run: |
          createdb lb
          for f in supabase/test/supabase-stub.sql supabase/schema.sql supabase/schema.sql supabase/test/checks.sql; do
            psql -d lb -v ON_ERROR_STOP=1 -q -f "$f"
          done
