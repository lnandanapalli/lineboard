# Included in every location block (nginx drops server-level add_header when a location sets its own).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# The site is only served over HTTPS (Azure App Service "HTTPS only"): browsers must never fall back to HTTP.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Popups opened from other sites cannot reach this window (window.opener).
add_header Cross-Origin-Opener-Policy "same-origin" always;
# connect-src allows https/wss so any Supabase URL (including custom domains) works.
# challenges.cloudflare.com: the optional bot check (Cloudflare Turnstile) at sign-in and sign-up.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https: wss:; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
